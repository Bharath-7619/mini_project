services:

  database:
    image: postgres:15
    container_name: nms-database

    environment:
      TZ: Asia/Kolkata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opennms

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  opennms:
    image: opennms/horizon:36.0.4
    container_name: opennms
    command: ["-s"]

    environment:
      TZ: Asia/Kolkata

      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: postgres
      OPENNMS_DBPASS: ${POSTGRES_PASSWORD}

    volumes:
      - opennms-data:/opennms-data
      - opennms-config:/opt/opennms/etc

    ports:
      - "8980:8980"
      - "8101:8101"

    depends_on:
      database:
        condition: service_healthy

  kong-database:
    image: postgres:15
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
      POSTGRES_DB: kong
    volumes:
      - kong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
  kong-migration:
    image: kong:3.9
    container_name: kong-migration
    command: "kong migrations bootstrap"
    restart: "no"
    environment:
       KONG_DATABASE: postgres
       KONG_PG_HOST: kong-database
       KONG_PG_PORT: 5432
       KONG_PG_USER: kong
       KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
       KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy

  kong:
    image: kong:3.9
    container_name: kong
    environment:
       KONG_DATABASE: postgres
       KONG_PG_HOST: kong-database
       KONG_PG_PORT: 5432
       KONG_PG_USER: kong
       KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
       KONG_PG_DATABASE: kong
       KONG_PROXY_ACCESS_LOG: /dev/stdout
       KONG_ADMIN_ACCESS_LOG: /dev/stdout
       KONG_PROXY_ERROR_LOG: /dev/stderr
       KONG_ADMIN_ERROR_LOG: /dev/stderr
       KONG_ADMIN_LISTEN: 0.0.0.0:8001
       KONG_PROXY_LISTEN: '0.0.0.0:8000, 0.0.0.0:8443 ssl'
       KONG_SSL_CERT: /kong/certs/kong.crt
       KONG_SSL_CERT_KEY: /kong/certs/kong.key

    volumes:
      - ./kong/certs:/kong/certs:ro

    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"

    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
      opennms:
        condition: service_started

  dashboard:
    build: ./dashboard
    container_name: nms-dashboard
    ports:
      - "3000:80"
    depends_on:
      - kong

volumes:
  postgres-data:
  opennms-data:
  opennms-config:
  kong-postgres-data:

